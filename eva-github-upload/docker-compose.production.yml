services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - eva_postgres_data:/var/lib/postgresql
    networks:
      - eva_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: api-runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_URL: ${ADMIN_URL}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      OTP_SECRET: ${OTP_SECRET}
      OTP_DEMO_MODE: ${OTP_DEMO_MODE}
      OTP_DEMO_ALLOWED_MOBILE: ${OTP_DEMO_ALLOWED_MOBILE}
      OTP_DEMO_CODE: ${OTP_DEMO_CODE}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION}
      MEDIA_S3_ACCESS_KEY_ID: ${MEDIA_S3_ACCESS_KEY_ID}
      MEDIA_S3_SECRET_ACCESS_KEY: ${MEDIA_S3_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - eva_internal

  storefront:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: storefront-runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
      SITE_URL: ${SITE_URL}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      SEO_INDEXING_ENABLED: "false"
    depends_on:
      - api
    expose:
      - "3000"
    networks:
      - eva_internal

  admin:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: admin-runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      API_URL: http://api:4000
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      STOREFRONT_URL: ${SITE_URL}
    depends_on:
      - api
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - eva_internal

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - storefront
      - api
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile:ro
      - eva_caddy_data:/data
      - eva_caddy_config:/config
    networks:
      - eva_internal

networks:
  eva_internal:
    driver: bridge

volumes:
  eva_postgres_data:
  eva_caddy_data:
  eva_caddy_config:
